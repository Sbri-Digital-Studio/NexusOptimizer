# Build e test automatici su ogni push e pull request.
# Runner Windows obbligatorio: i progetti sono net8.0-windows con WPF e su Linux non compilano.
name: Build e test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build e test su Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDK 10 anche se i progetti sono net8.0: il formato di soluzione .slnx
      # non e' leggibile dagli SDK precedenti.
      - name: Installa .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ripristino dipendenze
        run: dotnet restore NexusOptimizer.slnx

      - name: Compilazione
        run: dotnet build NexusOptimizer.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test NexusOptimizer.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Carica i risultati dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-test
          path: TestResults/*.trx
          if-no-files-found: warn
